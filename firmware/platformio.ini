; Shared ESP-IDF detector firmware for the Heltec WiFi LoRa 32 V4.3 and the
; Seeed Studio XIAO ESP32S3. This project is independent of the upstream
; Arduino build in the repository root, which is left unchanged so upstream
; changes merge cleanly.
;
; Build:   pio run -e xiao_esp32s3
;          pio run -e heltec_v43
; Tests:   pio test -e native      (needs a host C++ compiler on PATH)
;
; Board selection and board-specific settings come from the per-environment
; sdkconfig.defaults.<env> file, not from build flags.

[platformio]
default_envs = xiao_esp32s3
boards_dir = boards

[espidf_common]
; Pin the platform exactly; it selects the ESP-IDF and toolchain versions.
platform = espressif32@7.0.1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv

[env:xiao_esp32s3]
extends = espidf_common
board = seeed_xiao_esp32s3
; The running firmware's USB serial port is TinyUSB CDC-ACM: a 1200-baud touch
; reboots it into the serial bootloader, which appears as a new port.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.xiao_esp32s3"

[env:heltec_v43]
; Custom board definition (boards/heltec_wifi_lora_32_v43.json) for the
; standard V4 variant (ESP32-S3R2, 2 MB PSRAM, 16 MB flash). PSRAM is not
; enabled yet; the shared 8 MB flash layout fits within 16 MB.
extends = espidf_common
board = heltec_wifi_lora_32_v43
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.heltec_v43"

; Diagnostics build: heltec_v43 plus raw NMEA echo on the console.
[env:heltec_v43_debug_nmea]
extends = env:heltec_v43
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.heltec_v43;sdkconfig.defaults.debug_nmea"

; Host-side unit tests for the pure components: signature matching, NMEA
; parsing, and the display canvas and status-screen layout.
[env:native]
platform = native
build_src_filter = -<*>
lib_extra_dirs = components
lib_deps =
    fy_signatures
    fy_gps
    fy_display
    fy_ui
    fy_battery
    fy_store
    fy_status_led
    fy_device
    fy_dashboard
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DUNITY_INCLUDE_DOUBLE
